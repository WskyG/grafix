<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line Weaver</title>
<style>
  :root { color-scheme: dark; --bg: #000; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  #fs { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 10px; padding: 6px 10px; font: 13px system-ui, sans-serif; color: #ddd; background: rgba(0,0,0,.55); border: 1px solid #555; border-radius: 6px; cursor: pointer; opacity: .25; transition: opacity .2s; }
  #fs:hover, #fs:focus { opacity: 1; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="fs" type="button" title="Toggle full screen (F)">Full screen</button>
<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var STEPS_PER_FRAME = 3;
  var s;

  function ri(n) { return Math.floor(Math.random() * n); }

  function init() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, 1920, 1080);
    s = {
      X: 10 + ri(1900), Y: 10 + ri(1050), H: 10 + ri(1900), V: 10 + ri(1050),
      A: 1 + ri(8), B: 1 + ri(6), C: 1 + ri(6), D: 1 + ri(6),
      RD: 1 + ri(240), RA: 1 + ri(3),
      GR: 1 + ri(240), GA: 1 + ri(4),
      BL: 1 + ri(240), BA: 1 + ri(5),
      AB: Math.random() * 0.0001, AG: Math.random() * 0.0001, AR: Math.random() * 0.0001,
      CH: 0
    };
  }

  function col(r, g, b) {
    r = Math.max(0, Math.min(255, Math.floor(r)));
    g = Math.max(0, Math.min(255, Math.floor(g)));
    b = Math.max(0, Math.min(255, Math.floor(b)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function line(x1, y1, x2, y2, color) {
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1 + 0.5, y1 + 0.5);
    ctx.lineTo(x2 + 0.5, y2 + 0.5);
    ctx.stroke();
  }

  function step() {
    var S = s;
    line(S.X, S.Y, S.H, S.V, col(S.RD, S.GR, S.BL));
    line(1919 - S.X, 1079 - S.Y, 1919 - S.H, 1079 - S.V, col(255 - S.RD, 255 - S.GR, 255 - S.BL));
    line(S.X, 1079 - S.Y, S.H, 1079 - S.V, col(S.RD, 255 - S.GR, 0));
    line(1919 - S.X, S.Y, 1919 - S.H, S.V, col(0, S.GR, 255 - S.BL));

    S.X += S.A; if (S.X < 10 + Math.abs(S.A) || S.X > 1919 - Math.abs(S.A)) S.A = -S.A;
    S.Y += S.B; if (S.Y < 10 + Math.abs(S.B) || S.Y > 1079 - Math.abs(S.B)) S.B = -S.B;
    S.H += S.C; if (S.H < 10 + Math.abs(S.C) || S.H > 1919 - Math.abs(S.C)) S.C = -S.C;
    S.V += S.D; if (S.V < 10 + Math.abs(S.D) || S.V > 1079 - Math.abs(S.D)) S.D = -S.D;

    S.RD += S.RA; if (S.RD < Math.abs(S.RA) || S.RD > 255 - Math.abs(S.RA)) S.RA = -S.RA;
    S.GR += S.GA; if (S.GR < Math.abs(S.GA) || S.GR > 255 - Math.abs(S.GA)) S.GA = -S.GA;
    S.BL += S.BA; if (S.BL < Math.abs(S.BA) || S.BL > 255 - Math.abs(S.BA)) S.BA = -S.BA;

    S.RA += S.AR; if (S.RA < Math.abs(S.AR) || S.RA > 125) S.AR = -S.AR;
    S.BA += S.AB; if (S.BA < Math.abs(S.AB) || S.BA > 125) S.AB = -S.AB;
    S.GA += S.AG; if (S.GA < Math.abs(S.AG) || S.GA > 125) S.AG = -S.AG;

    if (S.CH === 4000) {
      S.AB = Math.random() * 0.0001; S.AG = Math.random() * 0.0001; S.AR = Math.random() * 0.0001;
      S.CH = 0;
      S.A = 2 + ri(8); S.B = 2 + ri(6); S.C = 2 + ri(6); S.D = 2 + ri(6);
    } else {
      S.CH++;
    }

  }

  function frame() {
    ctx.lineWidth = 1;
    for (var i = 0; i < STEPS_PER_FRAME; i++) step();
    requestAnimationFrame(frame);
  }

  // Any key or click starts a fresh random pattern
  function toggleFS() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) {}
  }
  document.getElementById('fs').addEventListener('click', function (e) { toggleFS(); this.blur(); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'f' || e.key === 'F') { toggleFS(); return; }
    if (e.target.id === 'fs') return;
    init();
  });
  cv.addEventListener('pointerdown', init);

  init();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
